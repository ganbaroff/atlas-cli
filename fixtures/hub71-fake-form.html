<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hub71 Application (FAKE FIXTURE — test only)</title>
</head>
<body>
  <h1>Hub71 Startup Application</h1>
  <p>This is a LOCAL TEST FIXTURE. Not a real portal.</p>
  <form id="application-form">
    <div>
      <label for="company-name">Company Name</label>
      <input type="text" id="company-name" name="company_name" />
    </div>
    <div>
      <label for="founder-name">Founder Name</label>
      <input type="text" id="founder-name" name="founder_name" />
    </div>
    <div>
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4"></textarea>
    </div>
    <div>
      <label for="sector">Sector</label>
      <select id="sector" name="sector">
        <option value="">-- Select --</option>
        <option value="fintech">FinTech</option>
        <option value="healthtech">HealthTech</option>
        <option value="ai">AI / Machine Learning</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div>
      <button type="submit" id="submit-btn">Submit Application</button>
    </div>
  </form>
</body>
</html>
