name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (clean clone)
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium (browser-hand tests)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
      - run: npx tsc --noEmit

      - name: Test
        run: npx vitest run
